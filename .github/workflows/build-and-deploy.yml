on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    # Use the labels currently assigned to your self-hosted runner
    runs-on: [self-hosted, Linux, arm64]

    steps:
      - uses: actions/checkout@v5

      - name: Check .NET Version
        run: dotnet --info

      - name: Build and Publish
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to /opt/windlord-worker 
        # rsync is safer than cp; it only copies changed files
        run: rsync -av --delete ./publish/ /opt/windlord-worker/

      - name: Restart Service
        run: sudo systemctl restart windlord-worker.service